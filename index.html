<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Hub - Maxwell</title>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        font-family: 'Consolas', monospace;
        background: #000;
        color: #00ff88;
        overflow: hidden;
    }

    /* Matrix canvas */
    #matrixCanvas {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0;
        background: #000;
    }

    /* Center container */
    .container {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 2rem;
        max-width: 500px;
        width: 90%;
        margin: auto;
        margin-top: 10vh;
    }

    .title {
        font-size: 3rem;
        font-weight: 400;
        letter-spacing: 0.15em;
        margin-bottom: 0.5rem;
        color: #00ff88;
        text-shadow: 0 0 15px #00ff88;
        animation: fadeInDown 1s ease-out;
    }

    .subtitle {
        font-size: 1.1rem;
        color: #66ffcc;
        margin-bottom: 3rem;
        letter-spacing: 0.1em;
        animation: fadeIn 1.5s ease-out;
    }

    .button-stack {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        align-items: center;
    }

    .nav-btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 300px;
        padding: 1.1rem 2rem;
        background: rgba(0,255,136,0.05);
        border: 1px solid rgba(0,255,136,0.4);
        border-radius: 50px;
        color: #00ff88;
        text-decoration: none;
        font-size: 1.1rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        overflow: hidden;
        transition: all 0.4s ease;
        cursor: pointer;
        animation: fadeInUp 1.2s ease-out;
    }

    .nav-btn:hover {
        border-color: #00ff88;
        box-shadow:
            0 0 25px rgba(0,255,136,0.4),
            inset 0 0 20px rgba(0,255,136,0.2);
        transform: translateY(-4px);
        color: #000;
        background: #00ff88;
    }

    .nav-btn::after {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        width: 0; height: 0;
        background: radial-gradient(circle, rgba(0,255,136,0.4), transparent);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.5s ease, height 0.5s ease;
    }

    .nav-btn:hover::after {
        width: 300px;
        height: 300px;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(25px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>

<canvas id="matrixCanvas"></canvas>

<div class="container">
    <h1 class="title">WELCOME</h1>
    <p class="subtitle">My Domain of personal projects</p>

    <div class="button-stack">

        <a href="./Project_Repository/Repository.html" class="nav-btn">
            <span class="btn-text">Project Repository</span>
            <span class="btn-glow"></span>
        </a>

        <a href="./Project_Documentation/Project_Documentation.html" class="nav-btn">
            <span class="btn-text">Project Documentation</span>
            <span class="btn-glow"></span>
        </a>

        <a href="./Project_Developer_Info/Developer_info.html" class="nav-btn">
            <span class="btn-text">Personal Info</span>
            <span class="btn-glow"></span>
        </a>

    </div>

</div>

<script>
    // Matrix effect
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const letters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&';
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#00ff88';
        ctx.font = fontSize + 'px Consolas';

        for (let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.95) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }

    setInterval(draw, 50);
</script>

</body>
</html>
