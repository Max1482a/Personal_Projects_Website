<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Repository</title>

<style>
    body {
        background: #0a0a0a;
        color: #fff;
        font-family: 'Segoe UI', sans-serif;
        margin: 0;
        padding: 20px;
    }

    /* SIDE NAVIGATION BUTTONS */
    .button-stack {
        position: fixed;
        top: 50%;
        left: 20px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 1rem;
        z-index: 10;
    }

    .nav-btn {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 50px;
        padding: 10px 20px;
        color: #fff;
        text-decoration: none;
        font-size: 0.9rem;
        letter-spacing: 0.05em;
        transition: 0.3s ease;
        text-align: center;
        width: 160px;
    }

    .nav-btn:hover {
        background: #fff;
        color: #000;
        box-shadow: 0 0 10px rgba(255,255,255,0.3);
        transform: translateX(5px);
    }

    .btn-text {
        display: inline-block;
    }

    h1 {
        text-align: center;
        font-weight: 300;
        margin-bottom: 25px;
        font-size: 2.4rem;
        background: linear-gradient(135deg, #fff, #bbb);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .section {
        width: 90%;
        max-width: 900px;
        margin: auto;
        margin-bottom: 30px;
        padding: 20px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(255,255,255,0.05);
        transition: 0.4s ease;
    }

    .section h2 {
        margin-bottom: 15px;
        font-weight: 300;
        font-size: 1.6rem;
    }

    .scroll-box {
        height: 250px;
        overflow-y: auto;
        padding-right: 10px;
        border-radius: 10px;
    }

    .file-bar {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: 0.3s ease;
        opacity: 0;
        transform: translateY(10px);
        animation: fadeIn 0.4s forwards;
    }

    @keyframes fadeIn {
        to { opacity: 1; transform: translateY(0); }
    }

    .remove-btn {
        background: transparent;
        border: 1px solid #ff5555;
        color: #ff5555;
        border-radius: 50px;
        padding: 5px 12px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: 0.3s;
    }

    .remove-btn:hover {
        background: #ff5555;
        color: #000;
    }

    .btn {
        background: transparent;
        border: 1px solid #fff;
        padding: 10px 20px;
        border-radius: 50px;
        color: #fff;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
        display: inline-block;
    }

    .btn:hover {
        background: #fff;
        color: #000;
    }

    select {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        background: #111;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
        margin-bottom: 10px;
    }

    input[type="file"] {
        margin-top: 10px;
    }

    .hidden {
        opacity: 0;
        height: 0;
        overflow: hidden;
        padding: 0;
        margin: 0;
        transition: 0.4s ease;
    }
</style>
</head>

<body>

<!-- SIDE NAVIGATION -->
<div class="button-stack">
    <a href="../Home_Page/Home_Page.html" class="nav-btn">
        <span class="btn-text">Main Page</span>
    </a>

    <a href="../Project_Documentation/Project_Documentation.html" class="nav-btn">
        <span class="btn-text">Documentation</span>
    </a>

    <a href="../Project_Developer_Info/Developer_info.html" class="nav-btn">
        <span class="btn-text">Personal Info</span>
    </a>

    <a href="../Index_file/Index/Index.html" class="nav-btn">
        <span class="btn-text">Navigation Hub</span>
    </a>
</div>

<h1>Project Repository</h1>

<!-- SECTION 1: REPOSITORY / TEMPORARY FILE QUEUE -->
<div class="section hidden" id="topSection">
    <h2 id="topTitle">Available Projects</h2>
    <div class="scroll-box" id="projectList"></div>
</div>

<!-- SECTION 2: UPLOAD FILES -->
<div class="section">
    <h2>Upload Files to a Project</h2>

    <label>Select Project:</label>
    <select id="projectSelector">
        <option value="">-- Choose Project --</option>
        <option value="Dissertation">Dissertation</option>
        <option value="Proxy Server">Proxy Server</option>
    </select>

    <label>Select Files:</label><br>
    <input type="file" id="fileUpload" multiple onchange="addFiles()">

    <button class="btn" onclick="saveFiles()">Submit Files</button>

    <div id="uploadStatus" style="margin-top:10px; color:#0af;"></div>
</div>

<!-- SECTION 3: PROJECT FILES -->
<div class="section">
    <h2>Listed Projects</h2>
    <div class="scroll-box" id="previewWindow">
        <p style="color:#777;"></p>
    </div>
</div>

<script>
let db;
let selectedFiles = [];

/* -------------------------
   IndexedDB Setup
------------------------- */
function initDB() {
    const request = indexedDB.open("RepoDB", 1);

    request.onupgradeneeded = function(event) {
        db = event.target.result;
        const projectStore = db.createObjectStore("projects", { keyPath: "id", autoIncrement: true });
        projectStore.createIndex("name", "name", { unique: false });

        const fileStore = db.createObjectStore("files", { keyPath: "id", autoIncrement: true });
        fileStore.createIndex("projectId", "projectId", { unique: false });
    };

    request.onsuccess = function(event) {
        db = event.target.result;
        renderFileList();
    };
}

initDB();

/* -------------------------
   Add Files to Temporary Queue
------------------------- */
function addFiles() {
    const input = document.getElementById("fileUpload");
    const newFiles = Array.from(input.files);
    selectedFiles.push(...newFiles);
    input.value = "";
    renderFileList();
}

/* -------------------------
   Render Temporary File Queue
------------------------- */
function renderFileList() {
    const list = document.getElementById("projectList");
    const title = document.getElementById("topTitle");
    const section = document.getElementById("topSection");

    if (selectedFiles.length === 0) {
        section.classList.add("hidden");
        list.innerHTML = "";
        return;
    }

    section.classList.remove("hidden");
    title.textContent = "Files Ready for Upload";
    list.innerHTML = "";

    selectedFiles.forEach((file, index) => {
        const div = document.createElement("div");
        div.className = "file-bar";
        div.innerHTML = `
            <span>${file.name}</span>
            <span style="color:#aaa; font-size:0.9rem;">${(file.size / 1024).toFixed(1)} KB</span>
            <button class="remove-btn" onclick="removeFile(${index})">Remove</button>
        `;
        list.appendChild(div);
    });
}

/* -------------------------
   Remove File
------------------------- */
function removeFile(index) {
    selectedFiles.splice(index, 1);
    renderFileList();
}

/* -------------------------
   Save Files to IndexedDB
------------------------- */
function saveFiles() {
    const projectName = document.getElementById("projectSelector").value;
    if (!projectName) return alert("Select a project first.");
    if (selectedFiles.length === 0) return alert("No files selected.");

    const tx = db.transaction(["files"], "readwrite");
    const store = tx.objectStore("files");

    selectedFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
            store.add({
                projectId: projectName,
                fileName: file.name,
                fileType: file.type,
                fileContent: e.target.result
            });
        };
        reader.readAsDataURL(file);
    });

    document.getElementById("uploadStatus").textContent = "Files uploaded successfully!";
    selectedFiles = [];
    renderFileList();
}
</script>

</body>
</html>
