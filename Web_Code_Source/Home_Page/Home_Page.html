<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #0a0a0a 0%, #000 70%);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.15), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.1), transparent),
                radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.12), transparent),
                radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.08), transparent),
                radial-gradient(2px 2px at 10% 80%, rgba(255,255,255,0.1), transparent);
            background-size: 200% 200%;
            animation: drift 25s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes drift {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 420px;
            width: 90%;
        }

        .title {
            font-size: 2.6rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInDown 0.8s ease-out;
        }

        .subtitle {
            font-size: 1rem;
            color: #777;
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 280px;
            padding: 1.1rem 2rem;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            animation: fadeInUp 0.8s ease-out both;
        }

        .nav-btn .btn-glow {
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
            z-index: 1;
        }

        .nav-btn:hover {
            border-color: rgba(255,255,255,0.6);
            box-shadow:
                0 0 20px rgba(255,255,255,0.15),
                inset 0 0 20px rgba(255,255,255,0.05);
            transform: translateY(-3px);
        }

        .nav-btn:hover .btn-glow {
            width: 300px;
            height: 300px;
        }

        .nav-btn:active {
            transform: scale(0.97);
            border-color: #fff;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="title">Main Page</h1>
        <p class="subtitle">Navigate to your sections</p>

        <div class="button-stack">

            
            <a href="../Project_Repository/Repository.html" class="nav-btn">
                <span class="btn-text">Project Repository</span>
                <span class="btn-glow"></span>
            </a>

            <a href="../Project_Documentation/Project_Documentation.html" class="nav-btn">
            <span class="btn-text">Project Documentation</span>
            <span class="btn-glow"></span>
            </a>


            <a href="../Project_Developer_Info/Developer_info.html" class="nav-btn">
            <span class="btn-text">Personal Info</span>
            <span class="btn-glow"></span>
            </a>

        </div>
    </div>
</body>
</html>
